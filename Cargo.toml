[workspace]
resolver = "2"
members = [
    "crates/keeper-core",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Minus-Wu"]
license = "MIT"
repository = "https://github.com/Minus-Wu/my-computer-keeper"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
blake3 = "1.5"
sysinfo = "0.33"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
base64 = "0.22"
rayon = "1.10"
walkdir = "2.5"
trash = "5.2"
chrono = { version = "0.4", features = ["serde"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_NetworkManagement_WNet",
    "Win32_System_RestartManager",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
tempfile = "3.14"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
rust-embed = "8.13"
winres = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

